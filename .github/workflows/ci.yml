name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 10.33.0

jobs:
  packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faro/types build
      - run: pnpm --filter @faro/validation build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-packages-dist
          path: |
            packages/types/dist
            packages/validation/dist
          retention-days: 1

  api:
    name: API — lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: packages
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faro
          POSTGRES_PASSWORD: faro_test_password
          POSTGRES_DB: faro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U faro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://faro:faro_test_password@localhost:5432/faro_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faro/types build
      - run: pnpm --filter @faro/validation build
      - run: pnpm --filter @faro/api prisma:generate
      - run: pnpm --filter @faro/api lint
      - run: pnpm --filter @faro/api typecheck
      - run: pnpm --filter @faro/api prisma:deploy
      - run: pnpm --filter @faro/api test
      - run: pnpm --filter @faro/api build

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faro/types build
      - run: pnpm --filter @faro/validation build
      - run: pnpm --filter @faro/mobile typecheck

  admin:
    name: Admin — typecheck, build
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faro/types build
      - run: pnpm --filter @faro/validation build
      - run: pnpm --filter @faro/admin typecheck
      - run: pnpm --filter @faro/admin build
